name: Update GitHub Profile Widgets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-widgets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      # GitHub Statistics
      - name: Generate GitHub Statistics
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/stats.svg
          include-title: true
          custom-title: GitHub Statistics
          colors: dark-dimmed
          hide-keys: languages
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages
      - name: Generate Top Languages
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/top-langs.svg
          include-title: true
          custom-title: Top Languages
          colors: dark-dimmed
          hide-keys: general, repositories, contributions
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contribution Activity
      - name: Generate Contribution Activity
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: "90"
          ranges: "30,90,365"
          layout: spacious
          output-dir: profile/activity

      # Save generated SVGs
      - name: Commit generated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub profile widgets"
          git push
